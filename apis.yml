aid: xalts
name: Xalts
description: >-
  Xalts (operated by Tokuten Pte Ltd) is an Accel-backed fintech building an
  AI agent platform for corporate treasury and finance teams — a copilot that
  automates trade finance operations (guarantees, trade payments, documentary
  credit and collections), liquidity management, and revenue operations.
  Task-specific agents learn internal processes and policies and integrate
  with ERPs, accounting systems, payment processors, and banks through the
  company's Omni Connect Protocol, which provides multi-bank connectivity via
  a single API. Xalts does not currently publish a public developer portal or
  API documentation; its connectivity APIs are offered to enterprise
  customers.
